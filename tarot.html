<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>塔罗占卜 · 星光抽牌</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  color: #f3d99b;
  font-family: "Noto Serif SC", "Songti SC", serif;
  background: #080a16;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(110,57,164,.35), transparent 40%),
    radial-gradient(ellipse at 50% 85%, rgba(89,36,111,.22), transparent 42%);
}
body::after {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .4;
  background: radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.7), transparent),
              radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,.5), transparent),
              radial-gradient(1px 1px at 40% 15%, rgba(255,255,255,.6), transparent),
              radial-gradient(1px 1px at 55% 55%, rgba(205,169,99,.45), transparent),
              radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,.55), transparent),
              radial-gradient(1px 1px at 85% 50%, rgba(205,169,99,.4), transparent),
              radial-gradient(1px 1px at 15% 70%, rgba(255,255,255,.5), transparent),
              radial-gradient(1px 1px at 60% 75%, rgba(205,169,99,.4), transparent),
              radial-gradient(1.5px 1.5px at 35% 80%, rgba(255,255,255,.5), transparent),
              radial-gradient(1px 1px at 80% 12%, rgba(255,255,255,.6), transparent);
}

.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 16px 48px;
}

h1 {
  font-size: clamp(28px, 5vw, 48px);
  letter-spacing: .2em; font-weight: 500;
  text-shadow: 0 0 24px rgba(217,169,85,.3);
  margin-bottom: 2px;
}
.subtitle {
  font-size: clamp(12px, 1.8vw, 16px);
  letter-spacing: .25em; color: #c9a970;
  margin-bottom: 24px;
}

/* ---- reading area ---- */
.reading-area {
  position: relative;
  display: flex; justify-content: center; align-items: center;
  margin: 8px 0 4px;
  z-index: 5;
}
.reading-rings {
  position: absolute;
  width: min(55vw, 420px); height: min(55vw, 420px);
  border: 1px solid rgba(190,145,73,.08); border-radius: 50%;
  box-shadow: 0 0 0 28px rgba(174,128,67,.03), 0 0 0 68px rgba(174,128,67,.018);
  background: repeating-conic-gradient(from 0deg, rgba(213,169,91,.06) 0 1deg, transparent 1deg 30deg);
  animation: orbit 28s linear infinite;
}
@keyframes orbit { to { transform: rotate(360deg); } }

.card-scene {
  width: clamp(180px, 30vw, 240px);
  aspect-ratio: 0.618;
  perspective: 1200px;
  z-index: 2;
}

.tarot-card {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .9s cubic-bezier(.22,.8,.22,1);
  border-radius: 16px;
}
.tarot-card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; border-radius: 16px;
  border: 1px solid rgba(214,174,97,.7);
  box-shadow: 0 0 0 1px rgba(48,29,69,.85), 0 0 0 2px rgba(155,113,52,.7), 0 0 24px rgba(160,93,224,.4);
  overflow: hidden;
}

.card-back {
  background-image: url("https://img.baibai.cv/f/7QGpTA/1784822793129.png");
  background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center;
}
.card-back::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, transparent 50%, rgba(0,0,0,.15) 100%);
  border-radius: 16px;
}
.card-front {
  transform: rotateY(180deg);
  padding: 10px;
  background: linear-gradient(145deg, #f2ddac, #8e6738);
}
.front-inner {
  height: 100%; border: 1px solid #3e2630; border-radius: 10px;
  padding: 8px 10px; text-align: center; color: #21182a;
  background: radial-gradient(circle at 50% 25%, rgba(255,255,255,.5), transparent 28%),
              linear-gradient(145deg, #eee0bd, #b68c58);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.front-number { font-size: clamp(11px, 1.6vw, 14px); letter-spacing: .2em; }
.front-symbol {
  font-size: clamp(44px, 7vw, 80px); color: #75502f;
  text-shadow: 0 2px 0 rgba(255,255,255,.3); margin: 6px 0;
}
.front-title { font-size: clamp(16px, 2.5vw, 22px); letter-spacing: .12em; font-weight: bold; }
.front-desc { margin-top: 6px; font-size: clamp(10px, 1.2vw, 12px); letter-spacing: .1em; opacity: .65; }

/* ---- deck area ---- */
.deck-area {
  width: 100%; max-width: 800px;
  position: relative;
  margin-top: 12px;
  display: flex; flex-direction: column; align-items: center;
}

.deck {
  position: relative;
  width: 100%;
  height: clamp(200px, 32vw, 340px);
  margin-bottom: 6px;
  display: flex; align-items: flex-end; justify-content: center;
}

.deck-inner {
  position: relative;
  display: flex; align-items: flex-end; justify-content: center;
  width: min(90%, 640px);
  height: 100%;
}

.deck-card {
  position: absolute;
  bottom: 0;
  width: clamp(58px, 10vw, 78px);
  aspect-ratio: 0.618;
  border-radius: 7px;
  border: 1px solid rgba(209,165,85,.65);
  background-color: #0e0c1a;
  cursor: pointer;
  transform-origin: 50% 100%;
  transition: transform .45s cubic-bezier(.2,.8,.3,1), filter .3s, box-shadow .35s;
  box-shadow: 0 3px 12px rgba(0,0,0,.5);
  overflow: hidden;
  z-index: var(--zi);
}

.deck-card::before {
  content: "";
  position: absolute; inset: 0;
  background-image: url("https://img.baibai.cv/f/7QGpTA/1784822793129.png");
  background-size: cover; background-position: center;
}
.deck-card::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.04), transparent 60%, rgba(0,0,0,.2));
  border-radius: 7px;
}

.deck-card:hover {
  filter: brightness(1.35);
  box-shadow: 0 0 22px rgba(180,100,240,.7);
  z-index: 200 !important;
}
.deck-card:active { filter: brightness(1.5); }

/* Hover lift */
.deck-card:hover:not(.shuffling-card):not(.chosen) {
  transform: var(--base-transform) translateY(-12px) !important;
}

/* Gather animation */
.deck-card.gathering {
  transition: transform .55s cubic-bezier(.4,0,.2,1);
}

/* Shuffle gather to center */
.deck-area.shuffling .deck-card {
  transition: transform .5s cubic-bezier(.4,0,.2,1);
}

/* Spread animation */
.deck-card.spreading {
  transition: transform .6s cubic-bezier(.1,.8,.3,1);
}

/* Selected card rises to reading position */
.deck-card.chosen {
  animation: riseToReading .85s cubic-bezier(.22,.7,.3,1) forwards;
  z-index: 300 !important;
  pointer-events: none;
}
@keyframes riseToReading {
  0% { transform: var(--base-transform) scale(1); opacity: 1; }
  40% { transform: var(--base-transform) translateY(-120px) scale(1.06); opacity: 1; }
  70% { transform: var(--base-transform) translateY(-200px) scale(1.08); opacity: .9; }
  100% { transform: var(--base-transform) translateY(-400px) scale(1.12); opacity: 0; }
}

/* ---- message ---- */
.message {
  min-height: 24px; margin-top: 6px;
  font-size: clamp(13px, 1.6vw, 15px);
  color: #c7a36d; text-align: center;
  letter-spacing: .06em;
}

/* ---- draw button ---- */
.draw-btn-wrap {
  position: relative;
  margin-top: 6px;
}
.magic-draw-btn {
  display: flex; align-items: center; justify-content: center;
  width: clamp(80px, 12vw, 100px);
  height: clamp(80px, 12vw, 100px);
  padding: 0; border: 0;
  background: transparent; cursor: pointer;
  filter: drop-shadow(0 0 12px rgba(207,145,255,.35));
  transition: transform .35s, filter .35s;
}
.magic-draw-btn svg {
  width: 100%; height: 100%;
  fill: none; stroke: #d8ad65; stroke-width: 1;
  overflow: visible;
}
.magic-draw-btn svg .magic-ring-1 { animation: magicSpin 20s linear infinite; transform-origin: 90px 90px; }
.magic-draw-btn svg .magic-ring-2 { animation: magicSpin 14s linear infinite reverse; transform-origin: 90px 90px; }
.magic-draw-btn svg text {
  fill: #f0d18c; stroke: none;
  font-size: 18px;
  filter: drop-shadow(0 0 6px rgba(225,180,255,.85));
}
.magic-draw-btn:hover {
  transform: scale(1.08);
  filter: drop-shadow(0 0 20px rgba(213,137,255,.8));
}
.magic-draw-btn:active { transform: scale(.92); }
.magic-draw-btn:disabled { opacity: .35; pointer-events: none; filter: none; }

@keyframes magicSpin { to { transform: rotate(360deg); } }

/* ---- particles ---- */
#particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden;
}
.particle {
  position: absolute; border-radius: 50%; background: #f5d88e;
  box-shadow: 0 0 8px 2px #d8a9ff;
  animation: floatUp linear forwards;
}
@keyframes floatUp {
  0% { transform: translate3d(0, 20px, 0) scale(.3); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate3d(var(--dx), -110vh, 0) scale(1.3); opacity: 0; }
}

.flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: 0;
  background: radial-gradient(circle at 50% 38%, rgba(224,182,255,.38), transparent 32%);
  transition: opacity .1s;
}
.flash.active { animation: flashBurst .85s ease-out; }
@keyframes flashBurst { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

/* ---- empty state (no card drawn) ---- */
.reading-placeholder {
  width: clamp(180px, 30vw, 240px);
  aspect-ratio: 0.618;
  border-radius: 16px;
  border: 1px dashed rgba(214,174,97,.25);
  display: flex; align-items: center; justify-content: center;
  color: rgba(200,170,110,.3);
  font-size: clamp(28px, 4vw, 40px);
}

/* ---- responsive ---- */
@media (max-width: 480px) {
  .page { padding: 20px 10px 36px; }
  .reading-rings { width: min(48vw, 180px); height: min(48vw, 180px); }
  .reading-area { margin: 4px 0 2px; }
}
</style>
</head>
<body>

<div id="particles"></div>
<div class="flash" id="flash"></div>

<main class="page">

  <h1>塔罗占卜</h1>
  <p class="subtitle">— 专注内心 · 探索指引 —</p>

  <section class="reading-area">
    <div class="reading-rings"></div>
    <div class="card-scene" id="cardScene">
      <div class="reading-placeholder" id="placeholder">✦</div>
      <div class="tarot-card" id="tarotCard" style="display:none">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
          <div class="front-inner">
            <div class="front-number" id="cardNumber"></div>
            <div class="front-symbol" id="cardSymbol"></div>
            <div class="front-title" id="cardTitle"></div>
            <div class="front-desc" id="cardDesc"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="deck-area" id="deckArea">
    <div class="deck" id="deck">
      <div class="deck-inner" id="deckInner"></div>
    </div>
    <p class="message" id="message">请从下方牌组中选择一张，或点击魔法阵抽牌</p>

    <div class="draw-btn-wrap">
      <button class="magic-draw-btn" id="drawBtn" aria-label="点击魔法阵抽牌">
        <svg viewBox="0 0 180 180" aria-hidden="true">
          <circle class="magic-ring-1" cx="90" cy="90" r="74"/>
          <circle class="magic-ring-1" cx="90" cy="90" r="60"/>
          <circle class="magic-ring-2" cx="90" cy="90" r="52"/>
          <path d="M90 20 L106 74 L160 90 L106 106 L90 160 L74 106 L20 90 L74 74 Z"/>
          <path d="M90 42 L95 85 L138 90 L95 95 L90 138 L85 95 L42 90 L85 85 Z"/>
          <path d="M62 62 Q90 38 118 62 Q142 90 118 118 Q90 142 62 118 Q38 90 62 62Z"/>
          <text x="90" y="96" text-anchor="middle">✦</text>
        </svg>
      </button>
    </div>
  </section>
</main>

<script>
const CARD_DATA = [
  { num: "0", sym: "\u2605", name: "\u611a\u8005", desc: "\u5f00\u59cb \u00b7 \u5192\u9669 \u00b7 \u5929\u771f" },
  { num: "I", sym: "\u25c6", name: "\u9b54\u672f\u5e08", desc: "\u521b\u9020 \u00b7 \u610f\u5fd7 \u00b7 \u6280\u5de7" },
  { num: "II", sym: "\u263d", name: "\u5973\u796d\u53f8", desc: "\u76f4\u89c9 \u00b7 \u795e\u79d8 \u00b7 \u5185\u7701" },
  { num: "III", sym: "\u2654", name: "\u5973\u7687", desc: "\u4e30\u9970 \u00b7 \u6bcd\u6027 \u00b7 \u611f\u5b98" },
  { num: "IV", sym: "\u265a", name: "\u7687\u5e1d", desc: "\u6743\u5a01 \u00b7 \u7ed3\u6784 \u00b7 \u7236\u6027" },
  { num: "V", sym: "\u271d", name: "\u6559\u7687", desc: "\u4fe1\u4ef0 \u00b7 \u4f20\u7edf \u00b7 \u6307\u5f15" },
  { num: "VI", sym: "\u2665", name: "\u604b\u4eba", desc: "\u9009\u62e9 \u00b7 \u7ed3\u5408 \u00b7 \u548c\u8c10" },
  { num: "VII", sym: "\u265e", name: "\u6218\u8f66", desc: "\u80dc\u5229 \u00b7 \u610f\u5fd7 \u00b7 \u638c\u63a7" },
  { num: "VIII", sym: "\u264c", name: "\u529b\u91cf", desc: "\u52c7\u6c14 \u00b7 \u8010\u5fc3 \u00b7 \u67d4\u97e7" },
  { num: "IX", sym: "\u263c", name: "\u9690\u8005", desc: "\u5185\u7701 \u00b7 \u667a\u6167 \u00b7 \u72ec\u5904" },
  { num: "X", sym: "\u25ce", name: "\u547d\u8fd0\u4e4b\u8f6e", desc: "\u8f6c\u53d8 \u00b7 \u5faa\u73af \u00b7 \u673a\u9047" },
  { num: "XI", sym: "\u2696", name: "\u6b63\u4e49", desc: "\u516c\u5e73 \u00b7 \u56e0\u679c \u00b7 \u771f\u76f8" },
  { num: "XII", sym: "\u23da", name: "\u5012\u540a\u4eba", desc: "\u727a\u7272 \u00b7 \u89c6\u89d2 \u00b7 \u91ca\u7136" },
  { num: "XIII", sym: "\u2620", name: "\u6b7b\u795e", desc: "\u7ec8\u7ed3 \u00b7 \u8f6c\u53d8 \u00b7 \u65b0\u751f" },
  { num: "XIV", sym: "\u2652", name: "\u8282\u5236", desc: "\u5e73\u8861 \u00b7 \u8c03\u548c \u00b7 \u4e2d\u5eb8" },
  { num: "XV", sym: "\u2644", name: "\u6076\u9b54", desc: "\u675f\u7f1a \u00b7 \u6b32\u671b \u00b7 \u9634\u5f71" },
  { num: "XVI", sym: "\u26a1", name: "\u9ad8\u5854", desc: "\u5d29\u574f \u00b7 \u89c9\u9192 \u00b7 \u91cd\u5efa" },
  { num: "XVII", sym: "\u2726", name: "\u661f\u661f", desc: "\u5e0c\u671b \u00b7 \u7075\u611f \u00b7 \u6307\u5f15" },
  { num: "XVIII", sym: "\u263e", name: "\u6708\u4eae", desc: "\u5e7b\u8c61 \u00b7 \u6050\u60e7 \u00b7 \u6f5c\u610f\u8bc6" },
  { num: "XIX", sym: "\u2600", name: "\u592a\u9633", desc: "\u559c\u60a6 \u00b7 \u6210\u529f \u00b7 \u6d3b\u529b" },
  { num: "XX", sym: "\u234f", name: "\u5ba1\u5224", desc: "\u89c9\u9192 \u00b7 \u53ec\u5524 \u00b7 \u91cd\u751f" },
  { num: "XXI", sym: "\u25ce", name: "\u4e16\u754c", desc: "\u5b8c\u6210 \u00b7 \u5706\u6ee1 \u00b7 \u65c5\u7a0b" }
];

const TOTAL_CARDS = 22;

const $ = (id) => document.getElementById(id);

const deckInner  = $("deckInner");
const deckArea   = $("deckArea");
const tarotCard  = $("tarotCard");
const placeholder = $("placeholder");
const message    = $("message");
const drawBtn    = $("drawBtn");
const particles  = $("particles");
const flashEl    = $("flash");
const cardNumber = $("cardNumber");
const cardSymbol = $("cardSymbol");
const cardTitle  = $("cardTitle");
const cardDesc   = $("cardDesc");

let cardOrder = [];
let hasDrawn = false;
let isAnimating = false;

function getCardCount() {
  const w = window.innerWidth;
  if (w < 380) return 9;
  if (w < 600) return 12;
  if (w < 900) return 16;
  return 22;
}

function getFanAngle(cardCount) {
  if (cardCount <= 9) return 90;
  if (cardCount <= 12) return 100;
  if (cardCount <= 16) return 105;
  return 110;
}

/* ---- audio ---- */
function tone(freq, start, dur, type, vol) {
  type = type || "sine";
  vol = vol || .16;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + .02);
    gain.gain.exponentialRampToValueAtTime(.0001, start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start); osc.stop(start + dur + .05);
  } catch(e) {}
}

function playShuffleSound() {
  var ctx = new (window.AudioContext || window.webkitAudioContext)();
  var now = ctx.currentTime;
  for (var i = 0; i < 8; i++) {
    tone(140 + Math.random() * 180, now + i * .07, .09, "triangle", .035);
  }
}

function playFlipSound() {
  var ctx = new (window.AudioContext || window.webkitAudioContext)();
  var now = ctx.currentTime;
  tone(400, now, .38, "sine", .16);
  tone(820, now + .05, .32, "sine", .055);
  tone(1260, now + .1, .38, "triangle", .045);
}

/* ---- particles ---- */
function burst(count) {
  count = count || 60;
  for (var i = 0; i < count; i++) {
    var p = document.createElement("i");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top  = (50 + Math.random() * 55) + "vh";
    p.style.setProperty("--dx", (Math.random() * 180 - 90) + "px");
    p.style.animationDuration = (2 + Math.random() * 3.5) + "s";
    p.style.animationDelay = (Math.random() * .5) + "s";
    var s = (1.5 + Math.random() * 2.5);
    p.style.width = p.style.height = s + "px";
    particles.appendChild(p);
    setTimeout(function() { p.remove(); }, 6500);
  }
}

function flashBurst() {
  flashEl.classList.remove("active");
  void flashEl.offsetWidth;
  flashEl.classList.add("active");
}

/* ---- Build fan layout ---- */
function buildDeck(animate, animClass) {
  animClass = animClass || "";
  var cardCount = getCardCount();
  deckInner.innerHTML = "";

  cardOrder = [];
  for (var j = 0; j < TOTAL_CARDS; j++) cardOrder.push(j);
  // Fisher-Yates shuffle
  for (var k = cardOrder.length - 1; k > 0; k--) {
    var r = Math.floor(Math.random() * (k + 1));
    var tmp = cardOrder[k];
    cardOrder[k] = cardOrder[r];
    cardOrder[r] = tmp;
  }

  var fanDeg = getFanAngle(cardCount);
  var fanRad = fanDeg * Math.PI / 180;
  var mid = (cardCount - 1) / 2;

  for (var i = 0; i < cardCount; i++) {
    var t = (i - mid) / mid;
    var angle = t * fanRad / 2;
    var rotDeg = angle * 180 / Math.PI;
    var arcY = -Math.abs(t) * 8 - (1 - Math.abs(t)) * 4;
    var scale = 1 - Math.abs(t) * .04;
    var zi = 10 + Math.round(Math.abs(t) * 50);

    var card = document.createElement("button");
    card.className = "deck-card";
    if (animClass) card.classList.add(animClass);
    card.setAttribute("aria-label", "选择第 " + (i + 1) + " 张塔罗牌");

    var transform = "rotate(" + rotDeg.toFixed(1) + "deg) translateY(" + arcY.toFixed(1) + "px) scale(" + scale.toFixed(2) + ")";
    card.style.transform = transform;
    card.style.setProperty("--base-transform", transform);
    card.style.setProperty("--zi", zi);
    card.dataset.dataIdx = cardOrder[i % TOTAL_CARDS];

    (function(cardEl) {
      card.addEventListener("click", function(e) {
        e.stopPropagation();
        if (!hasDrawn && !isAnimating) pickCard(cardEl);
      });
    })(card);

    deckInner.appendChild(card);
  }
}

/* ---- Pick card & reveal ---- */
function pickCard(cardEl) {
  if (hasDrawn || isAnimating) return;
  hasDrawn = true;
  isAnimating = true;
  drawBtn.disabled = true;

  var dataIdx = parseInt(cardEl.dataset.dataIdx);
  var data = CARD_DATA[dataIdx];

  cardNumber.textContent = data.num;
  cardSymbol.textContent = data.sym;
  cardTitle.textContent = data.name;
  cardDesc.textContent = data.desc;

  var allCards = deckInner.querySelectorAll(".deck-card");
  allCards.forEach(function(c) { c.style.pointerEvents = "none"; });

  cardEl.classList.add("chosen");
  message.textContent = "命运正在显现……";
  burst(40);

  setTimeout(function() {
    placeholder.style.display = "none";
    tarotCard.style.display = "block";
    tarotCard.classList.remove("flipped");
    void tarotCard.offsetWidth;

    playFlipSound();
    flashBurst();
    burst(80);
    tarotCard.classList.add("flipped");
    message.textContent = "你的牌是：" + data.name + " · " + data.desc;

    isAnimating = false;
    drawBtn.disabled = false;
  }, 900);
}

/* ---- Shuffle + auto-pick ---- */
function shuffleAndDraw() {
  if (hasDrawn) {
    resetAll();
    return;
  }
  if (isAnimating) return;

  isAnimating = true;
  hasDrawn = true;
  drawBtn.disabled = true;

  var allCards = deckInner.querySelectorAll(".deck-card");
  allCards.forEach(function(c) { c.style.pointerEvents = "none"; });

  // Phase 1: gather to center
  deckArea.classList.add("shuffling");
  allCards.forEach(function(c) {
    c.classList.add("gathering");
    c.style.transform = "rotate(0deg) translateY(0px) scale(1)";
  });

  message.textContent = "洗牌中……";
  playShuffleSound();
  burst(25);

  // Phase 2: rebuild with new random order and spread
  setTimeout(function() {
    deckArea.classList.remove("shuffling");
    var cardCount = getCardCount();
    var newOrder = [];
    for (var j = 0; j < TOTAL_CARDS; j++) newOrder.push(j);
    for (var k = newOrder.length - 1; k > 0; k--) {
      var r = Math.floor(Math.random() * (k + 1));
      var tmp = newOrder[k];
      newOrder[k] = newOrder[r];
      newOrder[r] = tmp;
    }
    cardOrder = newOrder;

    var fanDeg = getFanAngle(cardCount);
    var fanRad = fanDeg * Math.PI / 180;
    var mid = (cardCount - 1) / 2;

    allCards.forEach(function(card, i) {
      card.classList.remove("gathering");
      card.classList.add("spreading");
      var t = (i - mid) / mid;
      var angle = t * fanRad / 2;
      var rotDeg = angle * 180 / Math.PI;
      var arcY = -Math.abs(t) * 8 - (1 - Math.abs(t)) * 4;
      var scale = 1 - Math.abs(t) * .04;
      var zi = 10 + Math.round(Math.abs(t) * 50);

      var transform = "rotate(" + rotDeg.toFixed(1) + "deg) translateY(" + arcY.toFixed(1) + "px) scale(" + scale.toFixed(2) + ")";
      card.style.transform = transform;
      card.style.setProperty("--base-transform", transform);
      card.style.setProperty("--zi", zi);
      card.dataset.dataIdx = cardOrder[i % TOTAL_CARDS];
    });

    message.textContent = "命运已为你挑选……";
  }, 600);

  // Phase 3: auto-pick after spread
  setTimeout(function() {
    var cards = deckInner.querySelectorAll(".deck-card");
    cards.forEach(function(c) { c.classList.remove("spreading"); });
    var picked = cards[Math.floor(Math.random() * cards.length)];
    cards.forEach(function(c) { c.style.pointerEvents = "none"; });
    pickCard(picked);
  }, 1400);
}

function resetAll() {
  hasDrawn = false;
  isAnimating = false;
  tarotCard.classList.remove("flipped");
  tarotCard.style.display = "none";
  placeholder.style.display = "flex";
  drawBtn.disabled = false;
  message.textContent = "请从下方牌组中选择一张，或点击魔法阵抽牌";
  deckArea.classList.remove("shuffling");
  buildDeck();
}

drawBtn.addEventListener("click", shuffleAndDraw);

var resizeTimer;
window.addEventListener("resize", function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    if (!hasDrawn && !isAnimating) buildDeck();
  }, 300);
});

// Init
buildDeck();
</script>
