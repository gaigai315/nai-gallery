name = "gaigai315-nai-gallery"
compatibility_date = "2026-07-22"
pages_build_output_dir = "dist"

## Secrets & R2 credentials are injected via:
##   DISCORD_GUILD_ID, DISCORD_REQUIRED_ROLE_ID (optional — restrict login to guild members / specific role)

## Secrets & R2 credentials are injected via:
##   npx wrangler pages secret put <NAME> --project-name gaigai315-nai-gallery
## (live) or a local `.dev.vars` file for `wrangler pages dev`. Do NOT commit
## real secrets to this file. Required secrets:
##   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_REDIRECT_URI,
##   SESSION_SECRET, COOKIE_NAME, PUBLIC_BASE_URL,
##   R2_ACCOUNT_ID, R2_BUCKET_NAME, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
##   DOWNLOAD_URL_TTL_SECONDS, DOWNLOAD_LIMIT_PER_HOUR, IP_HASH_SECRET

[[d1_databases]]
binding = "DB"
database_name = "gaigai315-nai-gallery-db"
database_id = "4c291fa8-6b04-4deb-af4a-1b1499407838"

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "gaigai315-nai-gallery-images"
## Browser PUT direct-upload needs CORS on this bucket — apply with
## `npx wrangler r2 bucket cors set gaigai315-nai-gallery-images --file r2-cors.json --force` (see 部署手册.md).
